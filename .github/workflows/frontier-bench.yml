# On-demand frontier head-to-head: Claude Opus 5 vs GPT-5.6 Sol (or any
# models passed as inputs) on OUR probe set. No-ops safely per missing key.
# Zero Ollama involvement — this exercises the paid frontier APIs, so run it
# deliberately, not on a schedule.
name: Frontier bench (on demand)
on:
  workflow_dispatch:
    inputs:
      anthropic_models:
        description: "Comma-separated Anthropic model IDs"
        default: "claude-opus-5"
      openai_models:
        description: "Comma-separated OpenAI model IDs"
        default: "gpt-5.6-sol"
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run frontier bench (skips vendors whose key is unset)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 bench/frontier_bench.py \
            --anthropic-models "${{ inputs.anthropic_models }}" \
            --openai-models "${{ inputs.openai_models }}"
      - name: Commit report
        run: |
          if [ -n "$(git status --porcelain bench/reports)" ]; then
            git config user.name "frontier-bench"
            git config user.email "actions@users.noreply.github.com"
            git add bench/reports
            git commit -m "bench: frontier head-to-head report [skip ci]"
            git push
          else
            echo "no new report to commit"
          fi
