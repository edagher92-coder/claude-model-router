# Weekly fleet check: bench the Ollama Cloud models the router delegates to,
# and commit the dated report. No-ops safely until the OLLAMA_API_KEY secret
# is set. Zero Claude tokens — this only exercises the flat-rate Ollama sub.
name: Weekly model bench
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bench = run the probes; list = only print the model ids each hosted provider offers"
        type: choice
        options: [bench, list]
        default: bench
      qwen_models:
        description: "Qwen model ids for this run (comma list; overrides the QWEN_BENCH_MODELS variable)"
        required: false
        default: ""
      gemini_models:
        description: "Gemini model ids for this run (comma list from a list run; overrides GEMINI_BENCH_MODELS)"
        required: false
        default: ""
      glm_models:
        description: "GLM model ids for this run (comma list; overrides GLM_BENCH_MODELS)"
        required: false
        default: ""
  schedule:
    - cron: "0 20 * * 0"   # Mondays 06:00 AEST (Sunday 20:00 UTC)
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run bench (no-op if key unset)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          # Optional: enables the Claude Sonnet baseline head-to-head rows.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: only needed when ANTHROPIC_API_KEY is NOT scoped to a
          # workspace (the API then 400s without an anthropic-workspace-id
          # header). A workspace id is not a credential, so a repo variable is
          # fine; a secret works too.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}
          # Optional: Qwen API rows. QWEN_BENCH_MODELS is a repo variable
          # (comma list of model ids from `--qwen-list`); both unset = skipped.
          # Every *_BASE_URL is read from SECRETS ONLY, never vars: this repo is
          # public and GitHub prints Variables unmasked in the step's env
          # block, so a vars fallback would publish the account's endpoint in
          # the Actions log. Secrets are masked. QWEN_BASE_URL has no default:
          # unset = the Qwen rows are skipped with a note.
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_BENCH_MODELS: ${{ inputs.qwen_models || vars.QWEN_BENCH_MODELS }}
          # Optional: Google Gemini rows, same pattern (key + base override =
          # secrets, model list = repo variable; unset = skipped). Get the
          # exact model id from `--gemini-list` once GEMINI_API_KEY exists —
          # never hand-type a guessed id into GEMINI_BENCH_MODELS.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_BENCH_MODELS: ${{ inputs.gemini_models || vars.GEMINI_BENCH_MODELS }}
          # Optional: GLM (Zhipu / Z.ai) rows, same pattern.
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_BENCH_MODELS: ${{ inputs.glm_models || vars.GLM_BENCH_MODELS }}
          # Optional: xAI Grok rows, same pattern (env vars are XAI_*; the
          # CLI flags and report label say "grok").
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_BASE_URL: ${{ secrets.XAI_BASE_URL }}
          XAI_BENCH_MODELS: ${{ vars.XAI_BENCH_MODELS }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ inputs.mode || 'bench' }}
        run: |
          pip install anthropic --quiet || true
          # Paid hosted providers (Qwen, Gemini, GLM, Grok) run only when a
          # person starts the workflow by hand. The Sunday schedule keeps the
          # flat-rate Ollama fleet plus the existing Claude baseline: no new
          # recurring paid calls without an explicit budget decision.
          if [ "$EVENT_NAME" = "schedule" ]; then
            unset QWEN_API_KEY GEMINI_API_KEY GLM_API_KEY XAI_API_KEY
          fi
          if [ "$RUN_MODE" = "list" ]; then
            [ -n "$QWEN_API_KEY" ] && python3 bench/model_bench.py --qwen-list || true
            [ -n "$GEMINI_API_KEY" ] && python3 bench/model_bench.py --gemini-list || true
            [ -n "$GLM_API_KEY" ] && python3 bench/model_bench.py --glm-list || true
            [ -n "$XAI_API_KEY" ] && python3 bench/model_bench.py --grok-list || true
            exit 0
          fi
          if [ -z "$OLLAMA_API_KEY" ] && [ -z "$QWEN_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] \
             && [ -z "$GLM_API_KEY" ] && [ -z "$XAI_API_KEY" ]; then
            echo "No provider keys set - nothing to do. Add OLLAMA_API_KEY and/or QWEN_API_KEY/GEMINI_API_KEY/GLM_API_KEY/XAI_API_KEY to enable the weekly bench."
            exit 0
          fi
          if [ -n "$OLLAMA_API_KEY" ]; then
            # --discover auto-includes any NEW cloud model the bridge lists, so a
            # release like Kimi K3 Max is benched the first run after it lands,
            # with no code change. Runs on GitHub's servers -> works with the PC off.
            python3 bench/model_bench.py --discover
          else
            # No Ollama fleet to bench this run — skip its (large) default
            # model list rather than let every one of them fail against an
            # unreachable localhost daemon, and bench only whichever of
            # Qwen/Gemini/GLM/Grok/Claude-baseline actually has a key set.
            echo "OLLAMA_API_KEY not set - benching only the configured hosted providers."
            python3 bench/model_bench.py --models ""
          fi
      - name: Commit report
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'list' }}
        run: |
          if [ -n "$(git status --porcelain bench/reports)" ]; then
            git config user.name "model-bench"
            git config user.email "actions@users.noreply.github.com"
            git add bench/reports
            git commit -m "bench: weekly model report [skip ci]"
            git push
          else
            echo "no new report to commit"
          fi
